<title>Phần mềm nhập liệu hoạt động Phòng Thông tin và Phân tích TTLĐ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  // Link Web App chính thức của Trung tâm dịch vụ việc làm Quảng Trị đã kết nối Google Sheet
  const GOOGLE_DATABASE_URL = 'https://script.google.com/macros/s/AKfycbzDCdkMR9FCV4ziVyi9J0C7EvydOkNX07WMqZGtTMfy1ob40kse7SBrcvWVFf68LThoOw/exec';
  function dongBoLenGoogleSheets(fullBackupData) {
      if (!GOOGLE_DATABASE_URL) return;
      fetch(GOOGLE_DATABASE_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
              'Content-Type': 'application/json'
          },
          body: JSON.stringify(fullBackupData)
      })
      .then(() => {
          console.log('Dữ liệu đã tự động đồng bộ lên kho lưu trữ Google Sheets.');
      })
      .catch(err => {
          console.error('Lỗi đồng bộ dữ liệu:', err);
      });
  }

  // Hàm tự động gom dữ liệu hiện tại từ trình duyệt gửi đi khi bấm Lưu/Sao lưu
  async function kichHoatDongBoToanCuc() {
      try {
          const o = { ver: 1, ts: Date.now() };
          o['entries'] = await S.all('entries');
          o['settings'] = await S.all('settings');
          o['users'] = await S.all('users');
          o['reports'] = await S.all('reports');
          dongBoLenGoogleSheets(o);
      } catch (e) {
          console.error('Lỗi đóng gói dữ liệu đồng bộ:', e);
      }
  }
</script>



<style>:root{--navy:#0a2463;--navy2:#0f3a9a;--blue:#1d4ed8;--blue2:#3b6fe0;--light:#93b0ec;--pale:#e8efff;--bg:#f4f7fd;--card:#fff;--ink:#0f1f3d;--mut:#5b6b88;--line:#dbe4f3;--ok:#0f7b4f;--warn:#b45309;--bad:#b42318;box-sizing:border-box}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.hero{background:linear-gradient(100deg,var(--navy) 0%,var(--navy2) 55%,var(--blue) 100%);color:#fff;display:grid;grid-template-columns:minmax(240px,1fr) minmax(0,2.6fr) minmax(160px,1fr);align-items:center;gap:16px;padding:12px 22px;border-bottom:4px solid #7fa3ff}
.hero .org{display:flex;align-items:center;gap:12px}.hero .logo{background:#fff;border-radius:50%;padding:6px;box-shadow:0 0 0 3px rgba(255,255,255,.35);height:72px;width:72px;display:flex;align-items:center;justify-content:center;flex:none}.hero .logo img{max-width:100%;max-height:100%}
.hero .orgname{font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.4px;line-height:1.35}
.hero h1{margin:0;text-align:center;font-size:clamp(15px,2.1vw,27px);line-height:1.3;letter-spacing:.6px;text-transform:uppercase;font-weight:800;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.hero .by{text-align:right;font-size:12px;color:#cfe0ff;line-height:1.4}
.app{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 100px)}
.side{background:#fff;border-right:1px solid var(--line);padding:14px 12px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
.side .me{background:var(--pale);border-radius:10px;padding:10px 12px;margin-bottom:12px}.me b{display:block;color:var(--navy)}.me small{color:var(--mut)}
.side label{font-size:11px;color:var(--mut);font-weight:600;display:block;margin:8px 0 3px}
.side h6{margin:16px 6px 4px;font-size:11px;letter-spacing:.8px;color:#7a8aa8;font-weight:700}
.side a{display:block;padding:8px 10px;border-radius:8px;color:#34456b;cursor:pointer;text-decoration:none;border-left:3px solid transparent;margin:1px 0}
.side a:hover{background:#f1f5fd}.side a.on{background:var(--pale);color:var(--blue);font-weight:700;border-left-color:var(--blue)}
.side .out{margin-top:16px;width:100%}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.crumb{color:var(--mut)}.crumb b{color:var(--ink)}.top .sp{flex:1}
main{padding:18px 22px 40px;max-width:1320px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(15,31,61,.04)}
.card h3{margin:0 0 4px;font-size:15px;color:var(--navy)}.card h3 small{font-weight:400;color:var(--mut);margin-left:6px}
.pt{font-size:22px;font-weight:800;color:var(--navy);margin:0 0 2px}.sub{color:var(--mut);margin:0 0 14px}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.kpi{margin:0}.kpi .l{font-size:12px;color:var(--mut)}.kpi .v{font-size:28px;font-weight:800;color:var(--ink);letter-spacing:-.5px;line-height:1.2;margin:2px 0}.kpi .s{font-size:12px;color:var(--mut)}.kpi .s b{font-weight:700}
.bar{height:7px;background:#e6edfa;border-radius:4px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--blue);border-radius:4px}.bar.l i{background:var(--light)}
.ok{color:var(--ok)}.wn{color:var(--warn)}.bd{color:var(--bad)}
.btn{background:var(--blue);color:#fff;border:0;padding:9px 16px;border-radius:9px;font-weight:600;cursor:pointer}.btn:hover{background:var(--navy2)}.btn.sec{background:#fff;color:var(--blue);border:1px solid var(--blue)}.btn.sec:hover{background:var(--pale)}.btn.dg{background:var(--bad)}.btn.sm{padding:5px 10px;font-size:12px}.btn[disabled]{opacity:.5;cursor:default}
label.f{display:block;font-size:12px;color:var(--mut);margin-bottom:3px;font-weight:600}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}input:focus,select:focus,textarea:focus{outline:2px solid #bcd0fb;border-color:var(--blue)}
textarea{min-height:110px;line-height:1.5;resize:vertical}input[type=checkbox]{width:auto}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.row>div{flex:1;min-width:130px}.row>.n{flex:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;cursor:pointer;color:#34456b}.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}th{background:var(--pale);color:var(--navy);font-size:12px}td.n{text-align:right;white-space:nowrap}
.wrap{overflow-x:auto}.msg{margin-top:8px;font-weight:600;color:var(--warn)}.msg.g{color:var(--ok)}.mut{color:var(--mut);font-size:12px}
.chart{width:100%;height:auto;display:block}.chart .grid{stroke:#e6edfa}.chart .ax{font-size:11px;fill:#6b7a99}.chart .hi{fill:#eef3ff}.chart .pc{font-size:11px;font-weight:700}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mut);margin:6px 0}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:minmax(120px,1.2fr) 3fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #eef2fa}.hb .t{height:12px;background:#e9effb;border-radius:6px;overflow:hidden}.hb .t i{display:block;height:100%;background:var(--blue);border-radius:6px}.hb .nm{color:#34456b}.hb b{text-align:right;min-width:60px}
.tip{position:fixed;z-index:50;background:var(--navy);color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;pointer-events:none;max-width:280px;display:none;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.login{max-width:440px;margin:30px auto}.login .big{text-align:center;color:var(--navy);font-weight:800;font-size:18px;margin-bottom:6px}
.sg{font-size:12px;font-weight:700;color:var(--navy2);margin:14px 0 6px;padding-bottom:3px;border-bottom:1px dashed var(--line)}
.fl{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.fl label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}
.warn{background:#fff7e6;border:1px solid #f4d28a;border-radius:10px;padding:10px 14px;margin:10px 0;color:#7a4b00}
.sheetbox{overflow:auto;background:#e9eef9;padding:14px;border-radius:12px;border:1px solid var(--line)}
.sheet{background:#fff;color:#000;margin:0 auto;padding:30px 36px;font-family:"Times New Roman",Times,serif;font-size:15px;line-height:1.4}
.sheet.land{width:1123px}.sheet.por{width:794px}.sheet table{font-size:13px}.sheet th,.sheet td{border:1px solid #333;padding:4px 6px;color:#000}.sheet th{background:#e8eefb;text-align:center;white-space:pre-line}
.sheet tr.g td{background:#dfe8fb;font-weight:700}.sheet tr.h td{font-style:italic;font-weight:700}.sheet tr.b td{font-weight:700}
.sheet td[contenteditable]:hover{background:#fff8d6;outline:1px dashed #b38600}.sheet .hd{display:flex;justify-content:space-between;text-align:center;font-size:14px}.sheet .hd>div{flex:1}.sheet p{margin:4px 0;text-align:justify}.sheet p.i{text-indent:28px}
.sheet .ti{text-align:center;font-weight:700;font-size:17px;margin:14px 0 2px;white-space:pre-line}.sheet .su{text-align:center;font-style:italic;margin:0 0 12px}.sheet h5{margin:12px 0 4px;font-size:15px}
.sheet .sg2{display:flex;justify-content:space-between;margin-top:18px}.sheet .sg2>div{flex:1}
@media (max-width:900px){.hero{grid-template-columns:1fr}.hero .by{text-align:center}.hero .org{justify-content:center}.app{grid-template-columns:1fr}.side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}.side nav{display:flex;flex-wrap:wrap;gap:2px}.side h6{width:100%}main{padding:14px}}

 const type=rp.type,Y=rp.y,K=rp.k;let from,to,pf,pt,Y2=Y;
 if(type==='dx'){from=rp.from;to=rp.to;Y2=fy(to);[pf,pt]=nextPeriod('dx',Y2,K,to,days(from,to))}

const hx=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');

function barSvg(labels,ser,hi,unit,pcs,W0){

 let s=`<svg viewBox="0 0 ${W} ${Hh}" class="chart" role="img">`;

 <details style="margin-top:12px"><summary>Danh sách mã chỉ tiêu</summary><div class="wrap"><table><tr><th>Mã</th><th>Chỉ tiêu</th></tr>${ALLK.map(m=>`<tr><td><code>${m.k}</code></td><td>${esc(m.l)}</td></tr>`).join('')}</table></div></details></div>`}
async function saveCF(){const c={};['donvi','phong','phongNgan','truongphong','kyhieu','diadiem','noinhan'].forEach(k=>c[k]=$('c_'+k).value);try{await S.set('settings','cfg',{c});Object.assign(CFG,c);logA('Cập nhật thông tin đơn vị');toast('Đã lưu.')}catch(e){toast('Lưu thất bại: '+(e.message||e.code),1)}}
async function saveCUC(){const text=$('cuc').value;try{await S.set('settings','cuc',{text});CUC=text;logA('Cập nhật mẫu báo cáo Cục');toast('Đã lưu mẫu báo cáo Cục.')}catch(e){toast('Lưu thất bại: '+(e.message||e.code),1)}}
async function vNK(){
 $('main').innerHTML='<p class="pt">Nhật ký truy cập</p><p class="sub">100 thao tác gần nhất: đăng nhập, nhập/sửa/xóa số liệu, cấp tài khoản, xuất báo cáo.</p><div class="card"><div class="wrap" id="nk">Đang tải…</div></div>';
 const l=(await S.all('audit')).sort((a,b)=>b.ts-a.ts).slice(0,100);
 $('nk').innerHTML=`<table><tr><th>Thời gian</th><th>Người dùng</th><th>Thao tác</th><th>Chi tiết</th></tr>${l.map(a=>`<tr><td>${new Date(a.ts+7*3600e3).toISOString().replace('T',' ').slice(0,16)}</td><td>${esc(a.n||a.u)}</td><td>${esc(a.act)}</td><td>${esc(a.detail)}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">Chưa có nhật ký.</td></tr>'}</table>`}
boot();

</script></body></html>
